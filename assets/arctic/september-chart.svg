<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" role="img" aria-labelledby="title desc">
<title id="title">Arctic September monthly mean sea-ice extent, 1979–2026</title>
<desc id="desc">NSIDC Sea Ice Index Version 4, in million square kilometres. The graph preserves year-to-year increases as well as decreases. September extent was 7.05 in 1979, 3.57 in 2012, 5.21 in 2013, and 4.81 in 2026. These are monthly means, not daily minima.</desc>
